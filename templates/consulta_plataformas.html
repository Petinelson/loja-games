<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consultar Plataformas</title>
    <link rel="stylesheet" href="/static/styles/estilo.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
</head>

<body>
    <nav>
        <a href="/">Início</a> |
        <a href="/cadastro_plataformas">Cadastrar Plataformas</a> |
        <a href="/consulta_plataformas">Consultar Plataformas</a> |
        <a href="/cadastro_jogos">Cadastrar Jogos</a> |
        <a href="/consulta_jogos">Consultar Jogos</a>
    </nav>

    <div class="table-container">
        <h2>Plataformas Cadastradas</h2>
        <table>
            <thead>
                <tr>
                    <th>Item</th>
                    <th>Nome da Plataforma</th>
                    <th>Fabricante</th>
                    <th>Imagem</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody>
                {% for plataforma in plataformas %}
                <tr>
                    <td>{{ plataforma.linha + 1 }}</td>
                    <td>{{ plataforma.nome }}</td>
                    <td>{{ plataforma.fabricante }}</td>
                    <td>
                        <img src="{{ plataforma.imagem }}" alt="{{ plataforma.nome }}" width="100">
                        <!-- Exibe a imagem -->
                    </td>
                    <td>
                        <a href="/editar_plataforma?linha={{ plataforma.linha }}" class="link_plataforma">
                            <img src="/static/assets/edit.png" alt="Editar" title="Editar" class="icon">
                        </a> 
                        <a href="/excluir_plataforma?linha={{ plataforma.linha }}" class="link_plataforma">
                            <img src="/static/assets/delete.png" alt="Excluir" title="Excluir" class="icon">
                        </a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>

</html>
