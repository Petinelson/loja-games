<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Plataforma</title>
    <link rel="stylesheet" href="/static/styles/estilo.css">
</head>
<body>
    <nav>
        <a href="/">Início</a> |
        <a href="/cadastro_plataformas">Cadastrar Plataformas</a> |
        <a href="/consulta_plataformas">Consultar Plataformas</a> |
        <a href="/cadastro_jogos">Cadastrar Jogos</a> |
        <a href="/consulta_jogos">Consultar Jogos</a>
    </nav>
    <div class="form-container">
        <h2>Editar Plataforma</h2>
        <form action="/editar_plataforma?linha={{ plataforma.linha }}" method="POST">
            <label for="uuid">UUID:</label>
            <input type="text" id="uuid" name="uuid" value="{{ plataforma.cod_plataforma }}" readonly>

            <label for="nome">Nome da Plataforma:</label>
            <input type="text" id="nome" name="nome" value="{{ plataforma.nome }}" required>

            <label for="fabricante">Fabricante:</label>
            <input type="text" id="fabricante" name="fabricante" value="{{ plataforma.fabricante }}" required>

            <button type="submit">Salvar Alterações</button>
        </form>
    </div>
</body>
</html>
